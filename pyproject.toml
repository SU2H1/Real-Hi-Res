[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "realhires"
version = "2.0.0"
description = "Scan audio files and detect fake high-resolution audio (upsampled or bit-padded)."
readme = "README.md"
requires-python = ">=3.9"
# miniaudio: the 2.0 player's sound output (1.73 has wheels for Python 3.11+ on Windows x64,
# macOS x86_64/arm64 and manylinux 2.28 x86_64/aarch64)
dependencies = ["numpy>=1.21", "miniaudio>=1.59"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
realhires = "realhires.cli:main"

[project.gui-scripts]
realhires-gui = "realhires.gui:main"

[tool.setuptools]
packages = ["realhires"]

[tool.setuptools.package-data]
realhires = ["assets/*.png", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
