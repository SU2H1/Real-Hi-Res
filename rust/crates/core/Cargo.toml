[package]
name = "realhires-core"
description = "Detection core of Real-Hi-Res: finds fake hi-res and fake lossless audio files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "realhires"
path = "src/lib.rs"

[dependencies]
realfft = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
flate2 = "1"
crc32fast = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
