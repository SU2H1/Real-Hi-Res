name: Test, build and release

# * Every push / pull request: run the test suite and build all packages
#   (downloadable from the run's "Artifacts" section).
# * Pushing a tag such as v1.2.0, or pushing to main with a __version__ that
#   has not been released yet: additionally publish a GitHub Release with the
#   packages attached (see the release job).
#
# Every job runs packaging/ci_build.sh, which fetches FFmpeg, runs pytest with
# it, builds with PyInstaller, checks OS/CPU compatibility of every bundled
# binary (packaging/check_compat.py), smoke-tests the frozen CLI and packages.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed by the release job to create the release

jobs:
  windows:
    name: RealHiRes-windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pyinstaller pillow pytest
      - name: Build, test and package
        shell: bash
        env:
          ASSET: RealHiRes-windows-x64
        run: bash packaging/ci_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-windows-x64
          path: out/*
          if-no-files-found: error

  macos:
    name: RealHiRes-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64          # Apple Silicon (M1 and later)
            runner: macos-latest
            macos_min: "12.0"    # bundled FFmpeg (martin-riedl.de) needs 12
            numpy_platform: macosx_11_0_arm64
          - arch: x86_64         # Intel Macs
            runner: macos-15-intel
            macos_min: "10.15"
            numpy_platform: macosx_10_15_x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pillow pytest
          # pip would pick the NumPy wheel built for the runner's own (new) macOS;
          # take the one built for the oldest macOS we support instead.
          python -m pip download numpy --only-binary=:all: --no-deps -d wheels \
            --platform "${{ matrix.numpy_platform }}" --python-version 3.12 \
            --implementation cp --abi cp312
          python -m pip install wheels/numpy-*.whl
      - name: Build, test and package
        env:
          ASSET: RealHiRes-macos-${{ matrix.arch }}
          MACOS_MIN: ${{ matrix.macos_min }}
        run: bash packaging/ci_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  linux:
    name: RealHiRes-linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Build on glibc 2.28 so the package runs on (almost) every distribution
    # released since 2018; check_compat.py enforces it.
    container: almalinux:8
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: bash packaging/linux/setup_almalinux8.sh
      - name: Build, test and package
        env:
          ASSET: RealHiRes-linux-${{ matrix.arch }}
          PYTHON: /opt/venv/bin/python
          MAX_GLIBC: "2.28"
        run: bash packaging/ci_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # Publishes a GitHub Release when either
  #  * a tag vX.Y.Z is pushed (it must match realhires/__init__.py), or
  #  * main receives a commit whose __version__ has no release yet
  #    (so merging a version bump into main releases it automatically).
  release:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decide the release tag
        id: tag
        shell: bash
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('realhires/__init__.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match __version__ $VERSION"; exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "$TAG already exists - nothing to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
      - uses: actions/download-artifact@v6
        if: steps.tag.outputs.publish == 'true'
        with:
          path: assets
          merge-multiple: true
      - if: steps.tag.outputs.publish == 'true'
        run: ls -la assets
      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Real-Hi-Res ${{ steps.tag.outputs.tag }}
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: "true"
          files: assets/*
