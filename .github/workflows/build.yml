name: Test, build and release

# * Every push / pull request: run the test suite and build all packages
#   (downloadable from the run's "Artifacts" section).
# * Pushing a tag such as v1.2.0, or pushing to main with a __version__ that
#   has not been released yet: additionally scan the packages with VirusTotal,
#   Kaspersky and Hybrid Analysis (av-scan job) and then publish a GitHub
#   Release with the packages and those scan results (release job).  A release
#   is never published before its antivirus results are in its notes.
# * Run workflow (workflow_dispatch) with "av_scan": build and scan without
#   publishing, to try the scan on a branch.
#
# The Python jobs run packaging/ci_build.sh, which fetches FFmpeg, runs pytest
# with it, builds with PyInstaller, checks OS/CPU compatibility of every bundled
# binary (packaging/check_compat.py), smoke-tests the frozen CLI and packages.
# The rust-* jobs do the same for the Rust version with packaging/rust_build.sh
# (which also compares it with the Python version).  A release carries both.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      av_scan:
        description: "Also run the pre-release antivirus scan on the packages (nothing is published)"
        type: boolean
        default: false

permissions:
  contents: write   # needed by the release job to create the release

jobs:
  windows:
    name: RealHiRes-windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pillow pytest miniaudio
      # Compile PyInstaller's launcher here instead of using the prebuilt one from the
      # wheel: that one is shared by every PyInstaller program, malware included, so
      # antivirus engines flag it.  packaging/check_windows.py logs the launcher hash.
      - name: Install PyInstaller with a locally compiled launcher
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller
      - name: Build, test and package
        shell: bash
        env:
          ASSET: RealHiRes-windows-x64
        run: bash packaging/ci_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-windows-x64
          path: out/*
          if-no-files-found: error

  macos:
    name: RealHiRes-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64          # Apple Silicon (M1 and later)
            runner: macos-latest
            macos_min: "12.0"    # bundled FFmpeg (martin-riedl.de) needs 12
            numpy_platform: macosx_11_0_arm64
          - arch: x86_64         # Intel Macs
            runner: macos-15-intel
            macos_min: "10.15"
            numpy_platform: macosx_10_15_x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pillow pytest miniaudio
          # pip would pick the NumPy wheel built for the runner's own (new) macOS;
          # take the one built for the oldest macOS we support instead.
          python -m pip download numpy --only-binary=:all: --no-deps -d wheels \
            --platform "${{ matrix.numpy_platform }}" --python-version 3.12 \
            --implementation cp --abi cp312
          python -m pip install wheels/numpy-*.whl
      - name: Build, test and package
        env:
          ASSET: RealHiRes-macos-${{ matrix.arch }}
          MACOS_MIN: ${{ matrix.macos_min }}
        run: bash packaging/ci_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  linux:
    name: RealHiRes-linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Build on glibc 2.28 so the package runs on (almost) every distribution
    # released since 2018; check_compat.py enforces it.
    container: almalinux:8
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: bash packaging/linux/setup_almalinux8.sh
      - name: Build, test and package
        env:
          ASSET: RealHiRes-linux-${{ matrix.arch }}
          PYTHON: /opt/venv/bin/python
          MAX_GLIBC: "2.28"
        run: bash packaging/ci_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # The Rust version (rust/): packaging/rust_build.sh builds it, runs its tests
  # and the comparison with the Python version (tests/test_rust_parity.py),
  # checks OS/CPU compatibility, smoke-tests the CLI with the bundled FFmpeg and
  # packages it as RealHiRes-Rust-<version>-<platform>.
  rust-windows:
    name: RealHiRes-Rust-windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pytest
      - name: Install Rust
        shell: bash
        run: bash packaging/install_rust.sh
      - name: Build, test and package
        shell: bash
        env:
          ASSET: RealHiRes-Rust-windows-x64
        run: bash packaging/rust_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-Rust-windows-x64
          path: out/*
          if-no-files-found: error

  rust-macos:
    name: RealHiRes-Rust-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            macos_min: "12.0"    # bundled FFmpeg (martin-riedl.de) needs 12
          - arch: x86_64
            runner: macos-15-intel
            macos_min: "10.15"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pytest
      - name: Install Rust
        run: bash packaging/install_rust.sh >> "$GITHUB_PATH"
      - name: Build, test and package
        env:
          ASSET: RealHiRes-Rust-macos-${{ matrix.arch }}
          MACOS_MIN: ${{ matrix.macos_min }}
        run: bash packaging/rust_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-Rust-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  rust-linux:
    name: RealHiRes-Rust-linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # glibc 2.28, like the Python packages; check_compat.py enforces it.
    container: almalinux:8
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          bash packaging/linux/setup_almalinux8.sh
          dnf -y -q install gcc curl
          bash packaging/install_rust.sh >> "$GITHUB_PATH"
      - name: Build, test and package
        env:
          ASSET: RealHiRes-Rust-linux-${{ matrix.arch }}
          PYTHON: /opt/venv/bin/python
          MAX_GLIBC: "2.28"
        run: bash packaging/rust_build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: RealHiRes-Rust-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # Decides whether this run publishes a release: when either
  #  * a tag vX.Y.Z is pushed (it must match realhires/__init__.py), or
  #  * main receives a commit whose __version__ has no release yet
  #    (so merging a version bump into main releases it automatically).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
      scan: ${{ steps.tag.outputs.scan }}
    steps:
      - uses: actions/checkout@v5
      - name: Decide the release tag
        id: tag
        shell: bash
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('realhires/__init__.py').read()).group(1))")
          TAG="v$VERSION"
          PUBLISH=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $VERSION"; exit 1
            fi
            PUBLISH=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "$TAG already exists - nothing to release."
            else
              PUBLISH=true
            fi
          fi
          SCAN=$PUBLISH
          [ "${{ github.event_name == 'workflow_dispatch' && inputs.av_scan }}" != true ] || SCAN=true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "scan=$SCAN" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG, publish: $PUBLISH, antivirus scan: $SCAN"

  # Scans this run's packages before anything is published, and writes the
  # release notes with the "Antivirus scan results" section.  It fails, and so
  # holds the release back, when VirusTotal has no finished result for every
  # file (re-run the failed job to try again).  Releases created with
  # GITHUB_TOKEN start no other workflows, so av-scan.yml is called from here;
  # it also refreshes the latest release every day and runs on demand.
  av-scan:
    needs: [prepare, windows, macos, linux, rust-windows, rust-macos, rust-linux]
    if: needs.prepare.outputs.scan == 'true'
    uses: ./.github/workflows/av-scan.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      build_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      prerelease: true
    secrets: inherit

  release:
    needs: [prepare, av-scan]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: RealHiRes-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: release-notes
          path: notes
      - run: ls -la assets notes
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Real-Hi-Res ${{ needs.prepare.outputs.tag }}
          body_path: notes/release-notes.md
          generate_release_notes: true
          make_latest: "true"
          files: assets/*
