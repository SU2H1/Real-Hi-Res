# Builds and tests the Rust port in rust/ and compares it with the Python version.
# It is separate from build.yml on purpose: the release packages are still the
# Python version, so nothing here can hold back or change a release.
name: Rust port

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: rust-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pytest
      - name: Fetch FFmpeg
        shell: bash
        run: |
          python packaging/fetch_ffmpeg.py
          echo "$PWD/build/ffmpeg" >> "$GITHUB_PATH"
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Build
        working-directory: rust
        run: cargo build --release --locked
      # includes the desktop app's test, which drives the whole app headlessly
      - name: Rust tests
        working-directory: rust
        run: cargo test --release --locked
      - name: Compare with the Python version
        run: python -m pytest -q tests/test_rust_parity.py tests/test_detection.py
      - uses: actions/upload-artifact@v4
        with:
          name: realhires-rust-${{ matrix.name }}
          path: |
            rust/target/release/realhires
            rust/target/release/realhires.exe
            rust/target/release/realhires-gui
            rust/target/release/realhires-gui.exe
          if-no-files-found: error
